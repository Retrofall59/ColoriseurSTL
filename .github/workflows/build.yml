name: Compiler l'APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # "contents: write" necessaire uniquement pour l'etape de Release ci-dessous (creer une
    # Release et y attacher l'APK) - sans ca, le token automatique de l'action n'a que le droit
    # de lecture par defaut et la publication echouerait.
    permissions:
      contents: write
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Rendre gradlew executable
        run: chmod +x gradlew

      - name: Compiler l'APK (debug)
        run: ./gradlew assembleDebug

      - name: Nommer l'APK avec sa version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk "ColoriseurSTL-v${VERSION}.apk"
          echo "APK_NOM=ColoriseurSTL-v${VERSION}" >> "$GITHUB_ENV"

      - name: Recuperer l'APK genere
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NOM }}
          path: ${{ env.APK_NOM }}.apk

      # Publication d'une Release (13/10/2026, demande de Tomyn) - seulement quand ce build est
      # declenche par un TAG de version (git tag v0.17 && git push origin v0.17), jamais sur un
      # simple push de branche. Contrairement a l'artifact d'Actions ci-dessus (expire, demande
      # un compte GitHub pour le telecharger), une Release reste en ligne indefiniment avec un
      # lien stable, telechargeable par n'importe qui sans etre connecte - ce qui compte pour
      # partager l'APK sur le forum. "generate_release_notes" remplit automatiquement la page de
      # la Release avec la liste des commits depuis le tag precedent, en plus du CHANGELOG.md
      # tenu a la main.
      - name: Publier une Release (seulement sur un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.0.8
        with:
          files: ${{ env.APK_NOM }}.apk
          generate_release_notes: true
