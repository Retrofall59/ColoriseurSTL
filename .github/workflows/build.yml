name: Compiler l'APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Rendre gradlew executable
        run: chmod +x gradlew

      - name: Compiler l'APK (debug)
        run: ./gradlew assembleDebug

      - name: Nommer l'APK avec sa version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk "ColoriseurSTL-v${VERSION}.apk"
          echo "APK_NOM=ColoriseurSTL-v${VERSION}" >> "$GITHUB_ENV"

      - name: Recuperer l'APK genere
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NOM }}
          path: ${{ env.APK_NOM }}.apk

