name: Compiler l'APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '[0-9]*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # "contents: write" necessaire uniquement pour l'etape de Release ci-dessous (creer une
    # Release et y attacher l'APK) - sans ca, le token automatique de l'action n'a que le droit
    # de lecture par defaut et la publication echouerait.
    permissions:
      contents: write
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Rendre gradlew executable
        run: chmod +x gradlew

      - name: Compiler l'APK (debug)
        run: ./gradlew assembleDebug

      - name: Nommer l'APK avec sa version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk "ColoriseurSTL-v${VERSION}.apk"
          echo "APK_NOM=ColoriseurSTL-v${VERSION}" >> "$GITHUB_ENV"

      - name: Recuperer l'APK genere
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NOM }}
          path: ${{ env.APK_NOM }}.apk

      # Extrait la toute derniere entree de CHANGELOG.md (13/10/2026, Tomyn : la description
      # auto-generee par "generate_release_notes" - simple liste de commits - "est pourrie").
      # awk capture tout entre le PREMIER "## " (le titre de la derniere version) et le SUIVANT
      # (exclu), donc exactement l'entree la plus recente, telle qu'ecrite a la main dans le
      # changelog - plus lisible qu'une liste de commits bruts.
      - name: Extraire la derniere entree du changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          awk '/^## /{n++} n==1{print} n==2{exit}' CHANGELOG.md > derniere_entree_changelog.md

      # Publication d'une Release (13/10/2026, demande de Tomyn) - seulement quand ce build est
      # declenche par un TAG de version (via l'onglet Releases de GitHub, ou git tag + git push),
      # jamais sur un simple push de branche. Contrairement a l'artifact d'Actions ci-dessus
      # (expire, demande un compte GitHub pour le telecharger), une Release reste en ligne
      # indefiniment avec un lien stable, telechargeable par n'importe qui sans etre connecte.
      - name: Publier une Release (seulement sur un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.0.8
        with:
          files: ${{ env.APK_NOM }}.apk
          body_path: derniere_entree_changelog.md
